description: >-
  Cognizant Technology Solutions is a multinational information technology
  services and consulting company that provides digital, technology,
  consulting, and operations services to clients worldwide. Cognizant does not
  publish a general-purpose public REST API. Its developer-facing footprint is
  centered on the Cognizant Neuro AI platform family (Neuro AI Decisioning,
  Neuro AI Enterprise Core, Neuro AI Engineering, Neuro AI for IT Operations)
  and the open-source Neuro SAN multi-agent orchestration framework released
  by Cognizant AI Lab. Other delivered platforms (BigFrame for mainframe data
  migration, ADM accelerators, industry vertical solutions) are typically
  engaged via consulting engagements rather than self-service APIs.
